<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" font-family="Helvetica, Arial, sans-serif">
  <rect width="640" height="400" fill="#9ca3af"/>
  <rect x="40" y="30" width="560" height="340" fill="#ffffff" stroke="#111827" stroke-width="3"/>
  <rect x="40" y="30" width="560" height="28" fill="#111827"/>
  <text x="320" y="50" font-size="15" text-anchor="middle" fill="#ffffff">The World Wide Web project</text>
  <text x="64" y="100" font-size="26" font-weight="700" fill="#111827">World Wide Web</text>
  <g font-size="15" fill="#111827">
    <text x="64" y="136">The WorldWideWeb (W3) is a wide-area</text>
    <text x="64" y="158"><tspan fill="#1d4ed8" text-decoration="underline">hypermedia</tspan> information retrieval</text>
    <text x="64" y="180">initiative aiming to give universal</text>
    <text x="64" y="202">access to a large universe of documents.</text>
  </g>
  <g font-size="15" fill="#1d4ed8" text-decoration="underline">
    <text x="64" y="244">What's out there?</text>
    <text x="64" y="268">Help</text>
    <text x="64" y="292">Software Products</text>
    <text x="64" y="316">Technical</text>
  </g>
</svg>
